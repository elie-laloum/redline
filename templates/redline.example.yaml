# Les reglages par defaut de redline. ~/.redline/redline.yaml n'en porte que les surcharges :
# une valeur absente de ce fichier personnel vient d'ici, une liste remplace la liste par defaut.
# C'est aussi ce modele que la suite de tests lit.

schemaVersion: 2

budgets:                             # tours de boucle avant escalade
  testAdversary: 3
  redChecker: 3
  testDispute: 3
  greenChecker: 3
  codeAdversary: 3
  disputeBeforeEscalation: 2         # meme test conteste 2 fois = escalade
  developerBatchLines: 4             # lignes de checklist code par lot du developer
  grillRounds: 5                     # lots de questions par grill
  planRepairs: 2                     # plans refuses par la validation avant escalade
  memoryRepairs: 2
  proseRepairs: 2

timeouts:
  ciPipelineSeconds: 1800
  ciPollSeconds: 15
  repoSetupSeconds: 900
  commandSeconds: 1800               # plafond d'une commande du registre
  commandSilenceSeconds: 240         # silence tolere : au-dela, attente d'infrastructure
  containerStartSeconds: 180
  imagePullSeconds: 600
  agentSeconds: 3600                 # plafond d'un tour d'agent
  agentIdleSeconds: 600

memory:
  maxNoteLines: 100
  selection:                         # notes injectees dans les briefs
    maxNotes: 15
    maxLines: 400
  repository: null                   # URL d'un depot git dedie, clone dans ~/.redline/memory
  path: null                         # ou le chemin d'un clone existant ; aucun des deux : le home

naming:                              # placeholders : {type} {ticket} {slug} {titre} {n}
  types: [feature, bugfix, hotfix, documentation, chore, refactor, test, style, task]
  branch: "{type}/{ticket}-{slug}"
  mergeRequest: "{type}/{ticket}: {titre}"
  slackChannel: "{ticket}-{slug}"
  devVersionSuffix: "-{n}"
  slugMaxLength: 40
  typeFromJiraIssueType:
    Story: feature
    Task: task
    Tâche: task
    Bug: bugfix
    Bogue: bugfix
    Sous-tâche: task
    default: task

git: {}
#  committer:
#    name: Ada Lovelace
#    email: ada@example.com

gitlab:
  mrDraft: true

jira:
  transitions:
    default:
      afterMergeRequest: VALIDATION
    bySquad: {}                      # par prefixe de cle Jira, par exemple :
#      TJ:
#        afterMergeRequest: En cours

slack:
  channelVisibility: private
  invitees:                          # allowlist stricte, par prefixe de cle Jira
    default: []
    bySquad: {}                      # par exemple :
#      FT:
#        - first.dev@example.com
#        - second.dev@example.com

agents:
  authentication: account            # account | oauth | key — bun redline init, section Claude
  default:
    model: sonnet
  byRole:
    functional-grill: { model: opus }
    technical-grill: { model: opus }
    planner: { model: opus, reasoning: high }
    test-writer: { model: opus }
    appeal-arbiter: { model: opus }
    test-adversary: { model: opus }
    developer: { model: opus }
    code-adversary: { model: opus, reasoning: high }
    memory-planner: { model: opus }
    finalizer: { model: opus }

sandbox:
  image: redline-agent:claude-2.1.280    # bun redline image build
  agentChecks: false                 # true : le developer peut lancer lint et typecheck dans le conteneur

scope:
  concurrency: 3                     # scouts en parallele

services:                            # Jira et GitLab sont toujours lus
  slack: true                        # false : ni canal ni message
  figma: true                        # false : le cadrage ne lit aucune maquette
  jiraWrites: true                   # false : ni transition ni commentaire sur le ticket
